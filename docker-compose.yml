name: snitch

services:
  snitch-web:
    build:
      context: .
      dockerfile: docker/web/Dockerfile
    image: snitch-web:local
    ports:
      - "8000:8000"
    environment:
      PHP_CLI_SERVER_WORKERS: "4"
    volumes:
      - snitch-data:/data
    depends_on:
      snitch-engine:
        condition: service_healthy
      snitch-jev:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "php",
          "-r",
          "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s

  snitch-engine:
    build:
      context: .
      dockerfile: docker/engine/Dockerfile
    image: snitch-engine:local
    ports:
      - "8765:8765"
    environment:
      SNITCH_VISION_MOCK: ${SNITCH_VISION_MOCK:-1}
      SNITCH_LOOP_SOURCE: "1"
      SNITCH_STREAM_SOURCE: /clips/demo.avi
      JEV_URL: http://snitch-jev:8787
      SH17_WEIGHTS: /weights/sh17.pt
      MPLCONFIGDIR: /tmp/matplotlib
    volumes:
      - ./snitch/storage/engine:/weights
    depends_on:
      snitch-jev:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s

  snitch-jev:
    build:
      context: .
      dockerfile: docker/jev/Dockerfile
    image: snitch-jev:local
    ports:
      - "8787:8787"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/health', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  snitch-data:
